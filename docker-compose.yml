services:
  # ── PHP Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        user: clinic-app
        uid: 1500
    container_name: clinic-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php-fpm
      "
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: db
    ports:
      - "8031:9000"
    volumes:
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - app-storage:/var/www/html/storage/app
    networks:
      - clinic-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "echo 1;"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Nginx Web Server removed – host nginx talks FastCGI directly ──

  # ── MariaDB Database ────────────────────────────────────────────
  db:
    image: mariadb:11.4
    container_name: clinic-db
    restart: unless-stopped
    command:
      - --max_allowed_packet=67108864
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: clinic
      MYSQL_ROOT_PASSWORD: "Misho$$1234"
      MYSQL_PASSWORD: "Misho$$1234"
      MYSQL_USER: clinic
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PORT_EXPOSE:-9001}:3306"
    networks:
      - clinic-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── phpMyAdmin (dev only) ────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: clinic-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 256M
      MAX_EXECUTION_TIME: 600
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - clinic-net
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

networks:
  clinic-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  app-storage:
    driver: local